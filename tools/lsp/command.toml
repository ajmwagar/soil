schema = 1

[command]
name = "soil-lsp"
version = "0.1.0"
summary = "Soil Lisp language server"
module = "module.wasm"
# Workspace indexing and read-only source access.
requires = ["soil:index", "soil:vfs"]

[limits]
# A language server is long-lived; the runner's epoch is a runaway guard, not
# a request timeout.
timeout_ms = 86400000
max_stdout_bytes = 16777216
max_stderr_bytes = 1048576
max_memory_bytes = 268435456
