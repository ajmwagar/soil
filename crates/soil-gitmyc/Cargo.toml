[package]
name = "soil-gitmyc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The forge projection is a VFS concern: a path in the namespace, hydrated from
# content that the VFS verifies by its own content id. It is not a control-plane
# concern, so it does not live next to sessions and runs.
[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "2"
fungos-vfs = { git = "https://github.com/mycelium-linux/fungos-vfs.git", rev = "8ad45a7fb1ce01fbbc6f764d10524baf5a24c0af" }
getrandom = "0.2"
# Same version the workspace already builds; a second sqlite would be two
# copies of the same C library in one binary.
rusqlite = { version = "0.41", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
