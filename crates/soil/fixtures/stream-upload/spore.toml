schema = 1
[spore]
id = "dev.fungos.stream-upload"
name = "stream-upload"
version = "0.1.0"
license = "MIT"
summary = "Fixture: WSS bytes to a streamed VFS write"
[engine]
soil = ">=0.1"
target = "wasm32-wasip2"
abi = { stream = "0.1.0", vfs-mut = "0.1.0", time = "1.1.0" }
[module]
path = "module.wasm"
[launch]
default = "native"
surfaces = ["native"]
[grants]
"soil:stream" = "accept one WSS session"
"soil:vfs-mut" = "begin-write the received bytes"
"soil:time" = "poll accept"
